<ul class="profile-links" aria-label="Contact and profiles">
  {% if site.author.email %}<li><a href="mailto:{{ site.author.email }}"><i class="fas fa-envelope profile-link-icon" aria-hidden="true"></i><span>Email</span></a></li>{% endif %}
  {% if site.author.googlescholar %}<li><a href="{{ site.author.googlescholar | escape }}" aria-label="Google Scholar"><i class="ai ai-google-scholar profile-link-icon" aria-hidden="true"></i><span>Scholar</span></a></li>{% endif %}
  {% if site.author.github %}<li><a href="https://github.com/{{ site.author.github }}"><i class="fab fa-github profile-link-icon" aria-hidden="true"></i><span>GitHub</span></a></li>{% endif %}
  {% if site.author.linkedin %}<li><a href="https://www.linkedin.com/in/{{ site.author.linkedin }}"><i class="fab fa-linkedin profile-link-icon" aria-hidden="true"></i><span>LinkedIn</span></a></li>{% endif %}
</ul>
